<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Marketa MPIN reset code</title>
  </head>
  <body style="margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;color:#172033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;margin:0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #dce3ee;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:32px 32px 10px;text-align:center;">
                <div style="display:inline-block;width:44px;height:44px;line-height:44px;border-radius:999px;background:#006df0;color:#ffffff;font-size:20px;font-weight:700;">M</div>
                <h1 style="margin:18px 0 8px;font-size:24px;line-height:1.25;color:#172033;font-weight:700;">Your MPIN reset code</h1>
                <p style="margin:0;color:#687386;font-size:15px;line-height:1.6;">Enter this 8-digit code in Marketa to continue resetting your MPIN.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px;text-align:center;">
                <div style="display:inline-block;letter-spacing:8px;font-size:32px;line-height:1;font-weight:800;color:#172033;background:#eef6ff;border:1px solid #cfe4ff;border-radius:10px;padding:18px 18px 18px 26px;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px;text-align:center;">
                <p style="margin:0;color:#687386;font-size:13px;line-height:1.6;">If you didn't request this code, you can safely ignore this email. Never share this code with anyone.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
